name: Finals companion handbooks
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  companions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r handbooks/requirements.txt
      - run: sh handbooks/test.sh
      - run: SANITIZE=1 sh handbooks/test.sh
      - run: python handbooks/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: finals-companion-handbooks
          path: handbooks/pdf/*.pdf
