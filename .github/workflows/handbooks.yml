name: Finals companion handbooks
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  companions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install KACTL LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-plain-generic
      - run: python handbooks/build.py --generate-only
      - run: git diff --exit-code -- content/finals-math content/finals-implementations content/finals-patterns content/finals-math-extra content/finals-dp-extra content/finals-practical
      - run: sh handbooks/test.sh
      - run: SANITIZE=1 sh handbooks/test.sh
      - run: python handbooks/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: finals-companion-handbooks
          path: handbooks/pdf/*.pdf
