name: Build notebook PDF

# Builds kactl.pdf on every push and pull request.
# - Every run: the PDF is attached to the run as a downloadable artifact.
# - Pushes to main: the PDF is also published to the "latest" release,
#   so the newest notebook is always at
#   https://github.com/<owner>/<repo>/releases/download/latest/kactl.pdf

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notebook-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Install LaTeX
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-plain-generic

    - name: Build PDF
      run: make kactl

    - name: Upload PDF to this run
      uses: actions/upload-artifact@v4
      with:
        name: kactl-pdf
        path: kactl.pdf

    - name: Publish to the "latest" release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release view latest >/dev/null 2>&1 || \
          gh release create latest --prerelease --title "Latest notebook" \
            --notes "Built automatically from main. Download kactl.pdf below."
        gh release upload latest kactl.pdf --clobber
        gh release edit latest --notes "Built automatically from main at ${GITHUB_SHA::7}. Download kactl.pdf below."
